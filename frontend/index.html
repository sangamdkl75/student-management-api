<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Login Page -->
    <section id="login-page" class="page">
        <div class="auth-card">
            <h1>Student Management</h1>
            <p class="subtitle">Login to your account</p>

            <form id="login-form">
                <input
                    type="text"
                    id="login-username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Login</button>

                <p id="login-message" class="message"></p>
            </form>

            <p>
                Don't have an account?
                <button class="link-button" onclick="showPage('register-page')">
                    Register
                </button>
            </p>
        </div>
    </section>


    <!-- Register Page -->
    <section id="register-page" class="page hidden">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="subtitle">Register a new user</p>

            <form id="register-form">
                <input
                    type="text"
                    id="register-username"
                    placeholder="Username"
                    required
                >

                <input
                    type="password"
                    id="register-password"
                    placeholder="Password"
                    required
                >

                <button type="submit">Register</button>

                <p id="register-message" class="message"></p>
            </form>

            <p>
                Already have an account?
                <button class="link-button" onclick="showPage('login-page')">
                    Login
                </button>
            </p>
        </div>
    </section>


    <!-- Dashboard -->
    <section id="dashboard-page" class="hidden">

        <nav class="navbar">
            <div>
                <h2>Student Management</h2>
            </div>

            <div class="nav-right">
                <span id="current-user"></span>
                <button onclick="logout()">Logout</button>
            </div>
        </nav>

        <main class="container">

            <div class="dashboard-header">
                <div>
                    <h1>Students</h1>
                    <p>Manage student records</p>
                </div>

                <button id="add-student-btn" onclick="showStudentForm()">
                    + Add Student
                </button>
            </div>

            <div id="dashboard-message" class="message"></div>

            <!-- Student Form -->
            <div id="student-form-container" class="card hidden">

                <h2 id="student-form-title">Add Student</h2>

                <form id="student-form">

                    <input type="hidden" id="student-id">

                    <label>Name</label>
                    <input
                        type="text"
                        id="student-name"
                        placeholder="Student name"
                        required
                    >

                    <label>Age</label>
                    <input
                        type="number"
                        id="student-age"
                        placeholder="Age"
                        required
                    >

                    <label>Course</label>
                    <input
                        type="text"
                        id="student-course"
                        placeholder="Course"
                        required
                    >

                    <div class="form-buttons">
                        <button type="submit">Save Student</button>
                        <button
                            type="button"
                            class="secondary"
                            onclick="hideStudentForm()"
                        >
                            Cancel
                        </button>
                    </div>

                </form>
            </div>


            <!-- Student Table -->
            <div class="card">

                <div class="table-header">
                    <h2>Student List</h2>
                    <button class="secondary" onclick="loadStudents()">
                        Refresh
                    </button>
                </div>

                <div id="loading" class="loading hidden">
                    Loading students...
                </div>

                <div class="table-wrapper">

                    <table>
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Name</th>
                                <th>Age</th>
                                <th>Course</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

                        <tbody id="student-table-body">
                        </tbody>

                    </table>

                </div>

                <div id="empty-state" class="empty hidden">
                    No students found.
                </div>

            </div>

        </main>

    </section>


    <script src="js/app.js"></script>

</body>
</html>
